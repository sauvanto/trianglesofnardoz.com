<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triangles of Nardoz</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: 'Arial', sans-serif;
        }

        /* Scaled to display entirely on the screen without cropping */
        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            z-index: 1;
            transition: opacity 0.5s ease-in-out;
        }

        /* Top Navigation Tabs Container */
        .tabs-container {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            display: flex;
            gap: 15px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Tab Buttons Styling */
        .tab-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            padding: 10px 20px;
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        .tab-btn:hover {
            color: #ffffff;
        }

        .tab-btn.active {
            background: rgba(0, 150, 255, 0.3);
            color: #ffffff;
            border: 1px solid rgba(0, 150, 255, 0.6);
            box-shadow: 0 0 10px rgba(0, 150, 255, 0.4);
        }

        /* Foreground Content Layer */
        .text-overlay {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            pointer-events: none;
        }

        h1 {
            color: #ffffff;
            font-size: 3.5rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-align: center;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.9), 0 0 20px rgba(0, 150, 255, 0.8);
            margin: 0;
            padding: 20px;
            pointer-events: auto;
        }

        /* Wikipedia Link Button */
        .wiki-link {
            position: absolute;
            bottom: 40px;
            display: inline-block;
            padding: 12px 24px;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 150, 255, 0.5);
            border-radius: 4px;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 150, 255, 0.2);
            pointer-events: auto;
        }

        .wiki-link:hover {
            background: rgba(0, 150, 255, 0.2);
            border-color: rgba(0, 150, 255, 1);
            box-shadow: 0 0 20px rgba(0, 150, 255, 0.6);
            transform: translateY(-2px);
        }

        /* Clean Website Popup Overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        /* Modal Box Design */
        .modal-box {
            background: #121212;
            border: 1px solid rgba(0, 150, 255, 0.4);
            box-shadow: 0 0 30px rgba(0, 150, 255, 0.3);
            border-radius: 12px;
            padding: 30px;
            width: 320px;
            text-align: center;
            transform: scale(0.8);
            transition: transform 0.3s ease;
        }

        .modal-overlay.show .modal-box {
            transform: scale(1);
        }

        .modal-box h2 {
            color: #ffffff;
            margin-top: 0;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Clean Styled Password Inputs */
        .modal-box input[type="password"] {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            background: #1a1a1a;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            color: #ffffff;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            text-align: center;
            transition: border-color 0.3s ease;
        }

        .modal-box input[type="password"]:focus {
            border-color: rgba(0, 150, 255, 1);
            box-shadow: 0 0 8px rgba(0, 150, 255, 0.4);
        }

        /* Inline Action Buttons */
        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: space-between;
        }

        .modal-btn {
            flex: 1;
            padding: 10px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-submit {
            background: rgba(0, 150, 255, 0.3);
            border: 1px solid rgba(0, 150, 255, 0.7);
            color: #ffffff;
        }

        .btn-submit:hover {
            background: rgba(0, 150, 255, 0.6);
            box-shadow: 0 0 10px rgba(0, 150, 255, 0.5);
        }

        .btn-cancel {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.6);
        }

        .btn-cancel:hover {
            border-color: rgba(255, 255, 255, 0.5);
            color: #ffffff;
        }

        /* Error Label Message */
        #error-msg {
            color: #ff4a4a;
            font-size: 0.85rem;
            margin-top: 10px;
            min-height: 18px;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
                letter-spacing: 2px;
            }
            .tabs-container {
                top: 20px;
                width: 90%;
                justify-content: center;
            }
            .tab-btn {
                padding: 8px 14px;
                font-size: 0.75rem;
            }
            .wiki-link {
                bottom: 30px;
                padding: 10px 20px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <!-- Top Navigation Tabs -->
    <div class="tabs-container">
        <button id="classic-tab" class="tab-btn active" onclick="switchBackground('classic')">Classic</button>
        <button id="advanced-tab" class="tab-btn" onclick="openPopup()">Advanced Nardoz</button>
    </div>

    <!-- Background Image -->
    <img id="bg-img" src="background_image.png" alt="Background" class="bg-image">

    <!-- Foreground Content Layer -->
    <div class="text-overlay">
        <h1>Triangles of Nardoz</h1>
        
        <a href="https://en.wikipedia.org/wiki/Draft:The_Triangles_of_Nardoz#" target="_blank" class="wiki-link">
            Learn More on Wikipedia
        </a>
    </div>

    <!-- Custom Clean Web Popup Layer -->
    <div id="password-modal" class="modal-overlay">
        <div class="modal-box">
            <h2>Access Restricted</h2>
            <input type="password" id="pass-input" placeholder="Enter Password..." onkeydown="if(event.key === 'Enter') submitPassword()">
            <div class="modal-actions">
                <button class="modal-btn btn-cancel" onclick="closePopup()">Cancel</button>
                <button class="modal-btn btn-submit" onclick="submitPassword()">Unlock</button>
            </div>
            <div id="error-msg"></div>
        </div>
    </div>

    <!-- JavaScript Control Logic -->
    <script>
        let currentMode = 'classic';
        const modal = document.getElementById('password-modal');
        const passInput = document.getElementById('pass-input');
        const errorMsg = document.getElementById('error-msg');

        function openPopup() {
            if (currentMode === 'advanced') return;
            errorMsg.innerText = "";
            passInput.value = "";
            modal.classList.add('show');
            setTimeout(() => passInput.focus(), 100);
        }

        function closePopup() {
            modal.classList.remove('show');
        }

        function submitPassword() {
            if (passInput.value === "mickey_g69") {
                closePopup();
                switchBackground('advanced');
            } else {
                errorMsg.innerText = "Incorrect password. Access denied.";
                passInput.value = "";
                passInput.focus();
            }
        }

        function switchBackground(mode) {
            const bgImage = document.getElementById('bg-img');
            const classicTab = document.getElementById('classic-tab');
            const advancedTab = document.getElementById('advanced-tab');

            bgImage.style.opacity = 0;

            setTimeout(() => {
                if (mode === 'classic') {
                    bgImage.src = 'background_image.png';
                    classicTab.classList.add('active');
                    advancedTab.classList.remove('active');
                    currentMode = 'classic';
                } else if (mode === 'advanced') {
                    bgImage.src = 'advanced_nardoz.png'; 
                    advancedTab.classList.add('active');
                    classicTab.classList.remove('active');
                    currentMode = 'advanced';
                }
                bgImage.style.opacity = 1;
            }, 200);
        }

        document.getElementById('classic-tab').addEventListener('click', function() {
            switchBackground('classic');
        });
    </script>

</body>
</html>
