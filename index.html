<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triangles of Nardoz</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: 'Arial', sans-serif;
        }

        /* Forces the image to behave exactly like a background */
        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
        }

        /* Places the text directly on top of the image */
        .text-overlay {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        h1 {
            color: #ffffff;
            font-size: 3.5rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-align: center;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.9), 0 0 20px rgba(0, 150, 255, 0.8);
            margin: 0;
            padding: 20px;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
                letter-spacing: 2px;
            }
        }
    </style>
</head>
<body>

    <!-- Forcing the browser to fetch the image directly -->
    <img src="image_xHTsqQ.png" alt="Background" class="bg-image">

    <div class="text-overlay">
        <h1>Triangles of Nardoz</h1>
    </div>

</body>
</html>
